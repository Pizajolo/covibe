# This team's page on the covibe market. Customers see the title, summary,
# description, examples and the order form; never the team file or its prompts.
# Publish it with: covibe market publish examples/reel-cutter
storefront:
  title: Reel cutter
  summary: "Send your raw clips and a short brief; get back one vertical reel, ready to post."
  description: |
    Upload up to five clips and say what the reel is for. An editor agent
    studies your footage, plans the cut and renders a 9:16 reel (1080x1920,
    MP4). Before you pay, the result is measured (it plays, it is vertical,
    it is 5 to 90 seconds long) and reviewed against your brief. If those
    checks do not pass, you are refunded.
  price_near: 5
  windows: { accept_min: 60, delivery_min: 240, review_min: 1440 }
  intake:
    mode: recommend            # manual | recommend | auto
    budget_cap_usd: 3          # the run stops when it has spent this much
    estimated_cost_usd: 1.5
    min_price_near: 4
    max_input_mb: 48
    policy: |
      Short reels from the customer's own footage only. No footage of other
      people's copyrighted films, shows or music videos, nothing sexual or
      violent, and no requests to add material we do not have.
  inputs:
    - { name: footage, label: Your clips, type: files, accept: [".mp4", ".mov"], max_files: 5, folder: raw, required: true, help: "Up to five clips, 48 MB in total." }
    - { name: brief, label: What is the reel for?, type: text, required: true, max_chars: 2000, help: "Audience, mood, the moments that must be in, and how long it should be." }
  examples:
    - { title: Product teaser, text: "Three phone clips of a coffee machine became a 25-second teaser: close-ups first, the pour as the last shot." }
  goal: |
    Cut the customer's footage in raw/ into one vertical reel at out/reel.mp4,
    following their brief in ORDER.md.
  deliverables:
    folder: out
    gates_required: [render_ok, review]
